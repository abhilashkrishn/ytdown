services:
  streamvault:
    build: .
    container_name: streamvault
    restart: unless-stopped
    ports:
      - "127.0.0.1:8300:8300"
    env_file:
      - .env
    volumes:
      - ./temp_downloads:/app/temp_downloads
      - ./temp_downloads_tmpfs:/app/temp_downloads_tmpfs
      - ./run:/app/run
      - ./.env:/app/.env:ro
      - ./cookies.txt:/app/cookies.txt
    init: true
    security_opt:
      - no-new-privileges:true